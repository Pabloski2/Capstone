# Perfil de respaldo: base H2 en memoria (los datos se pierden al reiniciar).
# Se activa con spring.profiles.active=h2 en application.properties.
spring.datasource.url=jdbc:h2:mem:financialbeacon
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Hibernate crea las tablas primero y después se cargan los datos de inversión
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=optional:classpath:db/no-existe.sql
spring.sql.init.data-locations=classpath:db/datos_inversion_h2.sql
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
