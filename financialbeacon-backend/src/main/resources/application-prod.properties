# Perfil de producción: SPRING_PROFILES_ACTIVE=prod
# Variables de entorno requeridas: DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD, JWT_SECRET,
#                                  BREVO_API_KEY, MAIL_FROM (o MAIL_PROVIDER=smtp + MAIL_USERNAME, MAIL_PASSWORD)
#                                  Opcional: SOPORTE_EMAIL
# DATABASE_URL en formato JDBC, por ejemplo: jdbc:postgresql://HOST:5432/financialbeacon

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# "update" crea/ajusta las tablas al arrancar. Para una versión más madura conviene Flyway o Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Sin valor por defecto: si falta JWT_SECRET, el servidor no arranca (a propósito).
app.jwt.secret=${JWT_SECRET}

# Orígenes permitidos. La app móvil usa https://localhost (Android) y capacitor://localhost (iOS).
# Si además publicas el frontend web, agrega su dominio separado por comas.
app.cors.allowed-origins=${CORS_ORIGINS:https://localhost,capacitor://localhost}

server.error.include-message=never
server.error.include-stacktrace=never

# Correo: en producción por defecto se usa la API de Brevo (funciona en Railway, que bloquea el SMTP).
# Variables: BREVO_API_KEY y MAIL_FROM. Para SMTP: MAIL_PROVIDER=smtp, MAIL_USERNAME y MAIL_PASSWORD.
# Si faltan las credenciales del proveedor elegido, el servidor no arranca (a propósito).
app.mail.provider=${MAIL_PROVIDER:brevo}
