spring.application.name=financialbeacon
server.port=${PORT:8080}

# ---- Desarrollo: H2 en archivo (./data), los datos sobreviven a los reinicios ----
# Para producción se activa el perfil "prod" (PostgreSQL): ver application-prod.properties
spring.datasource.url=jdbc:h2:file:./data/financialbeacon
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Sesión (JWT) ----
# En producción JWT_SECRET es obligatorio (mínimo 32 caracteres). Este valor es SOLO para desarrollo.
app.jwt.secret=${JWT_SECRET:dev-secret-solo-para-desarrollo-cambiar-en-produccion-0123456789}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:168}

# ---- CORS: quién puede llamar a la API ----
# Incluye localhost (Vite), la red local (probar desde el celular) y la app móvil (Capacitor).
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,https://localhost,capacitor://localhost

# ---- Correo (recuperación de contraseña y soporte) ----
# MAIL_PROVIDER:
#   smtp  -> SMTP clásico (Gmail, etc.): MAIL_USERNAME + MAIL_PASSWORD (contraseña de aplicación de Gmail).
#   brevo -> API HTTPS de Brevo: BREVO_API_KEY + MAIL_FROM (remitente verificado en Brevo).
#            Es la opción para Railway, que bloquea el SMTP en los planes Trial, Free y Hobby.
# Si no hay credenciales (desarrollo), los correos NO se envían: se escriben en la consola del servidor.
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:Financial Beacon}
app.mail.brevo.api-key=${BREVO_API_KEY:}
# Bandeja que recibe las solicitudes de soporte (por defecto, el remitente).
app.soporte.email=${SOPORTE_EMAIL:${MAIL_FROM:${MAIL_USERNAME:}}}

# SMTP (solo si MAIL_PROVIDER=smtp). Gmail: verificación en 2 pasos + contraseña de aplicación
# (https://myaccount.google.com/apppasswords).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
